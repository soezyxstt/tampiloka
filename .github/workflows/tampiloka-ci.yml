name: Tampiloka web CI

on:
  push:
    paths:
      - "apps/tampiloka/**"
      - "packages/brand-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "AGENTS.md"
      - ".github/workflows/tampiloka-ci.yml"
  pull_request:
    paths:
      - "apps/tampiloka/**"
      - "packages/brand-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "AGENTS.md"
      - ".github/workflows/tampiloka-ci.yml"
  workflow_dispatch:
    inputs:
      catalog_url:
        description: "Public HTTPS catalog URL for the runtime browser check"
        type: string
        default: "https://catalog.tampiloka.site/catalog.v1.json"

permissions:
  contents: read

concurrency:
  group: tampiloka-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, catalog and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://tampiloka.site"
      TEMPLATE_CATALOG_URL: ${{ inputs.catalog_url || 'https://catalog.tampiloka.site/catalog.v1.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate route types
        run: pnpm --filter @tampiloka/web exec next typegen
      - name: Typecheck
        run: pnpm --filter @tampiloka/web typecheck
      - name: Lint
        run: pnpm --filter @tampiloka/web lint
      - name: Verify the shared brand assets
        run: pnpm --filter @tampiloka/web check:brand
      - name: Verify the runtime catalog contract
        run: pnpm --filter @tampiloka/web verify:catalog
      - name: Build Tampiloka
        run: pnpm --filter @tampiloka/web build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the public catalog is available
        run: curl --fail --silent --show-error --max-time 15 "$TEMPLATE_CATALOG_URL" --output "$RUNNER_TEMP/tampiloka-catalog.json"
      - name: Start the production build
        shell: bash
        run: |
          pnpm --filter @tampiloka/web start > "$RUNNER_TEMP/tampiloka-next.log" 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:3000/api/template-catalog > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/tampiloka-next.log"
          exit 1
      - name: Verify gallery behavior and responsive layouts
        run: pnpm --filter @tampiloka/web verify:templates-browser
      - name: Verify shared navigation and contact controls
        run: pnpm --filter @tampiloka/web verify:ui-browser
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tampiloka-templates-browser
          path: |
            artifacts/templates-qa
            ${{ runner.temp }}/tampiloka-next.log
          if-no-files-found: warn

